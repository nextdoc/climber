name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: sudo apt-get install -y zsh
      - run: bun install
      - run: bun test ./cli

  # The rest of the suite needs bash, so Windows runs only the map tests, through cmd.exe and PowerShell.
  map-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun test ./cli/lib/map.test.ts ./cli/map.shell.test.ts
